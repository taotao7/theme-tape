# --- Zenith: Light Mode ---
# Generated from palette.toml
# Compatible with @tape_* variable convention

# ── Palette Variables ──
set -g @tape_bg "#f0edf8"
set -g @tape_fg "#2a2840"
set -g @tape_red "#c83858"
set -g @tape_orange "#b86828"
set -g @tape_yellow "#907020"
set -g @tape_green "#2a8858"
set -g @tape_cyan "#1880a0"
set -g @tape_blue "#3060c0"
set -g @tape_purple "#6838b0"
set -g @tape_pink "#b83878"
set -g @tape_gray "#2a2840"
set -g @tape_dark "#e6e3f0"
set -g @tape_void "#f0edf8"
set -g @tape_active_bg "#{@tape_orange}"
set -g @tape_active_fg "#{@tape_bg}"

# tmux 3.8+ chooser text uses native theme colours, not window-style.
# -q leaves older tmux versions on their existing ANSI colours.
set -sq theme light
set -sq light-theme-black "#{@tape_void}"
set -sq light-theme-white "#{@tape_fg}"
set -sq light-theme-light-grey "#5c5878"
set -sq light-theme-dark-grey "#{@tape_dark}"
set -sq light-theme-red "#{@tape_red}"
set -sq light-theme-green "#{@tape_green}"
set -sq light-theme-yellow "#{@tape_yellow}"
set -sq light-theme-blue "#{@tape_blue}"
set -sq light-theme-cyan "#{@tape_cyan}"
set -sq light-theme-magenta "#{@tape_purple}"
setw -gq tree-mode-selection-style "bg=#cfc8e0,fg=#{@tape_fg},bold"
setw -gq tree-mode-preview-style "bg=#{@tape_dark},fg=#{@tape_fg}"

# ── Force Refresh Styles ──
set -g status-style "bg=#f0edf8,fg=#{@tape_fg}"
set -g window-status-activity-style "fg=#{@tape_orange},bold"
set -g window-status-bell-style "fg=#{@tape_red},bold,blink"
set -g mode-style "bg=#{@tape_cyan},fg=#{@tape_dark},bold"
set -g message-style "bg=#{@tape_dark},fg=#{@tape_cyan},border-style=double"
set -g message-command-style "bg=#{@tape_dark},fg=#{@tape_orange}"
setw -g pane-active-border-style "fg=#{@tape_cyan},bg=default"
setw -g pane-border-style "fg=#{@tape_gray},bg=default"
setw -g pane-border-lines double

# Copy mode styling
setw -g mode-style "bg=#{@tape_cyan},fg=#{@tape_dark},bold"

# Light page: default pane text is ink, not a washed gray.
set -g window-style "fg=#{@tape_fg},bg=default"
set -g window-active-style "fg=#{@tape_fg},bg=default"
