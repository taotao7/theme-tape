# --- Cassette Futurism: Dark Mode ---
# Generated from palette.toml
# Compatible with @tape_* variable convention

# ── Palette Variables ──
set -g @tape_bg "default"
set -g @tape_fg "#d4d4d4"
set -g @tape_red "#ff5555"
set -g @tape_orange "#ffb86c"
set -g @tape_yellow "#f1fa8c"
set -g @tape_green "#50fa7b"
set -g @tape_cyan "#8be9fd"
set -g @tape_blue "#8be9fd"
set -g @tape_purple "#bd93f9"
set -g @tape_pink "#ff79c6"
set -g @tape_gray "#8a8f96"
set -g @tape_dark "#1f2327"
set -g @tape_void "#1a1d21"
set -g @tape_active_bg "#{@tape_orange}"
set -g @tape_active_fg "#{@tape_dark}"

# tmux 3.8+ chooser text uses native theme colours, not window-style.
# -q leaves older tmux versions on their existing ANSI colours.
set -sq theme dark
set -sq dark-theme-black "#{@tape_void}"
set -sq dark-theme-white "#{@tape_fg}"
set -sq dark-theme-light-grey "#8a8f96"
set -sq dark-theme-dark-grey "#{@tape_dark}"
set -sq dark-theme-red "#{@tape_red}"
set -sq dark-theme-green "#{@tape_green}"
set -sq dark-theme-yellow "#{@tape_yellow}"
set -sq dark-theme-blue "#{@tape_blue}"
set -sq dark-theme-cyan "#{@tape_cyan}"
set -sq dark-theme-magenta "#{@tape_purple}"
setw -gq tree-mode-selection-style "bg=#2d3238,fg=#{@tape_fg},bold"
setw -gq tree-mode-preview-style "bg=#{@tape_dark},fg=#{@tape_fg}"

# ── Force Refresh Styles ──
set -g status-style "bg=default,fg=#{@tape_fg}"
set -g window-status-activity-style "fg=#{@tape_orange},bold"
set -g window-status-bell-style "fg=#{@tape_red},bold,blink"
set -g mode-style "bg=#{@tape_dark},fg=#{@tape_orange},bold"
set -g message-style "bg=#{@tape_dark},fg=#{@tape_green},border-style=double"
set -g message-command-style "bg=#{@tape_dark},fg=#{@tape_cyan}"
setw -g pane-active-border-style "fg=#{@tape_green},bg=default"
setw -g pane-border-style "fg=#{@tape_gray},bg=default"
setw -g pane-border-lines double

# Copy mode styling
setw -g mode-style "bg=#{@tape_dark},fg=#{@tape_orange},bold"
